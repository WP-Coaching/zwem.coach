version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    assignees:
      - "robinpellegrims"
    schedule:
      interval: "weekly"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Tooling updates can be reviewed using the required CI checks.
      quality-and-test:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "@pellegrims/eslint-config-base"
          - "typescript"
          - "@typescript/*"
          - "@types/*"
          - "prettier"
          - "@playwright/*"
          - "playwright"
        update-types:
          - "minor"
          - "patch"
      # Keep last: unmatched packages need website/deployment preview review.
      # This includes frontend dependencies, @opennextjs/cloudflare and wrangler.
      website-and-deployment:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    assignees:
      - "robinpellegrims"
    schedule:
      interval: "weekly"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "build"
      include: "scope"
